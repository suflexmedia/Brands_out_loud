            pdfUrl = &quot;https://iwyjssxhrcucnrkzkvmt.supabase.co/storage/v1/object/public/magazine-pdfs/CXO%20TechBOT%20October%202024-1-25.pdf&quot;;
        }
        const qualityParam = (urlParams.get(&#39;quality&#39;) || &#39;&#39;).toLowerCase();
        const QUALITY_FACTOR = qualityParam === &#39;ultra&#39; ? 2.0 : qualityParam === &#39;high&#39; ? 1.5 : qualityParam === &#39;med&#39; ? 1.2 : 1.0;

        function getQuickScale() {
            return Math.max(window.devicePixelRatio, 1) * 0.9;
        }
        function getHighScale() {
            return (isFullscreen ? 2.0 : 1.8) * EFFECTIVE_DPR;

            if (!px || px < 1) return 1;

        function releasePage(pageNum) {
            const shell = pageShells[pageNum];
            if (shell &amp;&amp; shell.canvas) {
                const ctx = shell.canvas.getContext(&#39;2d&#39;);
                if (ctx) ctx.clearRect(0, 0, shell.canvas.width, shell.canvas.height);
                shell.canvas.width = 0;
                shell.canvas.height = 0;
                shell.content.querySelectorAll(&#39;.url-overlay&#39;).forEach((el) => el.remove());
                if (!shell.content.querySelector(&#39;.page-placeholder&#39;)) {

                    const pSpinner = document.createElement(&#39;div&#39;);
                    pSpinner.className = &#39;placeholder-spinner&#39;;
                    placeholder.appendChild(pSpinner);
                    shell.content.appendChild(placeholder);
                }
            }
            delete pagesCache[pageNum];
            renderedPages.delete(pageNum);
        }

        function evictOutsideWindow(centerPage, radius) {
            const keepFrom = Math.max(1, centerPage - radius);
            const keepTo = Math.min(totalPages, centerPage + radius);
            renderedPages.forEach((p) => {

        function calculatePageDimensions() {
            const container = document.getElementById(&#39;flipbook-container&#39;);
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            if (!viewport) return { width: 300, height: 400 };

            const pageAspectRatio = viewport.width / viewport.height;
            const padding = isFullscreen ? 40 : 20;
            const controlsHeight = 65;

            const availableWidth = containerWidth - (padding * 2);
            const availableHeight = containerHeight - controlsHeight - (padding * 2);

            const singlePageMode = getEffectiveWidth() <= 768 || containerWidth <= 768;
            let pageWidth = (availableWidth * 0.98) / (singlePageMode ? 1 : 2);
            let pageHeight = pageWidth / pageAspectRatio;
            if (pageHeight > availableHeight * 0.95) {
                pageHeight = availableHeight * 0.95;
                pageWidth = pageHeight * pageAspectRatio;
            }

            return {
                width: Math.floor(pageWidth),
                height: Math.floor(pageHeight)
            };
        }

        async function renderPage(pageNum, quality = &#39;low&#39;) {
            if (!pdfDoc) return null;

            const cache = pagesCache[pageNum];
            if (cache &amp;&amp; ((quality === &#39;low&#39; &amp;&amp; cache.lowCanvas) || (quality === &#39;high&#39; &amp;&amp; cache.highCanvas))) {
                return cache;
            }

            try {
                const page = await pdfDoc.getPage(pageNum);

                let baseViewport, links;
                if (!cache) {
                    baseViewport = page.getViewport({ scale: 1 });
                    const annotations = await page.getAnnotations();
                    links = annotations
                        .filter(ann => ann.subtype === &#39;Link&#39; &amp;&amp; ann.url &amp;&amp; ann.rect)
                        .map(ann => {
                            try {
                                const [x1, y1, x2, y2] = baseViewport.convertToViewportRectangle(ann.rect);
                                const left = Math.min(x1, x2);
                                const top = Math.min(y1, y2);
                                const width = Math.abs(x2 - x1);
                                const height = Math.abs(y2 - y1);
                                return { url: ann.url, rect: [left, top, width, height] };
                            } catch {
                                return null;
                            }
                        })
                        .filter(Boolean);
                } else {
                    baseViewport = cache.baseViewport;
                    links = cache.links;
                }

                let desiredScale;
                const pageCanvasEl = document.querySelector(`.page[data-page=&quot;${pageNum}&quot;] canvas`);
                if (pageCanvasEl &amp;&amp; baseViewport) {
                    const targetPxW = pageCanvasEl.width || Math.floor(pageCanvasEl.clientWidth * EFFECTIVE_DPR);
                    const targetPxH = pageCanvasEl.height || Math.floor(pageCanvasEl.clientHeight * EFFECTIVE_DPR);
                    const scaleW = targetPxW / baseViewport.width;
                    const scaleH = targetPxH / baseViewport.height;
                    const displayScale = Math.min(scaleW, scaleH);
                    const oversample = 1.0;
                    desiredScale = Math.max(1, displayScale * oversample);
                } else {
                    desiredScale = quality === &#39;low&#39; ? getQuickScale() : getHighScale();
                }
                const renderViewport = page.getViewport({ scale: desiredScale });

                const maxSide = Math.max(renderViewport.width, renderViewport.height);
                let finalViewport = renderViewport;
                if (maxSide > MAX_CANVAS_SIDE) {
                    const shrink = MAX_CANVAS_SIDE / maxSide;
                    finalViewport = page.getViewport({ scale: desiredScale * shrink });
                }

                const canvas = document.createElement(&#39;canvas&#39;);
                const context = canvas.getContext(&#39;2d&#39;, { alpha: false });
                canvas.height = finalViewport.height;
                canvas.width = finalViewport.width;

                await page.render({
                    canvasContext: context,
                    viewport: finalViewport
                }).promise;

                try { page.cleanup(); } catch (e) {}

                pagesCache[pageNum] = {
                    ...(cache || {}),
                    baseViewport,
                    links,
                    lowCanvas: quality === &#39;low&#39; ? canvas : (cache ? cache.lowCanvas : null),
                    highCanvas: quality === &#39;high&#39; ? canvas : (cache ? cache.highCanvas : null),
                };

                if (quality === &#39;high&#39; &amp;&amp; pagesCache[pageNum].lowCanvas) {
                    pagesCache[pageNum].lowCanvas = null;
                }

                return pagesCache[pageNum];
            } catch (error) {
                console.error(`Error rendering page ${pageNum} (${quality}):`, error);
                return null;
            }
        }

        function addUrlOverlays(pageContent, links, baseViewport, dimensions) {
            const bw = baseViewport.width || 1;

                overlay.style.width = `${Math.max(0, (width / bw) * 100)}%`;

            const canvas = document.createElement(&#39;canvas&#39;);
            const mult = (isFullscreen ? 2.0 : 1.5) * QUALITY_FACTOR;
            canvas.width = clampCanvasSide(Math.floor(dimensions.width * EFFECTIVE_DPR * mult));
            canvas.height = clampCanvasSide(Math.floor(dimensions.height * EFFECTIVE_DPR * mult));
            canvas.style.width = &#39;100%&#39;;

        }

        function createBlankPageShell(dimensions) {
            const page = document.createElement(&#39;div&#39;);
            page.className = &#39;page&#39;;
            page.dataset.blank = &#39;true&#39;;

        function drawInto(targetCanvas, sourceCanvas) {
            const ctx = targetCanvas.getContext(&#39;2d&#39;, { alpha: false });
            ctx.imageSmoothingEnabled = true;
            if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = &#39;high&#39;;
            ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
            ctx.drawImage(
                sourceCanvas,
                0, 0, sourceCanvas.width, sourceCanvas.height,
                0, 0, targetCanvas.width, targetCanvas.height
            );
        }

        async function upgradePageCanvasToHigh(pageNum, dimensions) {
            const data = await renderPage(pageNum, &#39;high&#39;);
            if (!data) return;
            const pageEl = document.querySelector(`.page[data-page=&quot;${pageNum}&quot;]`);
            if (!pageEl) return;

        function rebuildAllPagesForQuality() {
            const dims = calculatePageDimensions();
            const pages = document.querySelectorAll(&#39;#flipbook .page&#39;);
            pages.forEach((pageEl) => {
                if (pageEl.dataset.blank === &#39;true&#39;) return;
                const canvas = pageEl.querySelector(&#39;canvas&#39;);
                if (!canvas) return;
                const dpr = EFFECTIVE_DPR;
                const mult = (isFullscreen ? 2.0 : 1.5) * QUALITY_FACTOR;
                const targetW = clampCanvasSide(Math.floor(dims.width * dpr * mult));
                const targetH = clampCanvasSide(Math.floor(dims.height * dpr * mult));
                if (canvas.width === targetW &amp;&amp; canvas.height === targetH) return;
                canvas.width = targetW;
                canvas.height = targetH;
                const pageNum = parseInt(pageEl.dataset.page, 10);
                if (!isNaN(pageNum) &amp;&amp; renderedPages.has(pageNum)) {
                    upgradePageCanvasToHigh(pageNum, dims);

                const rect = progressBar.getBoundingClientRect();

                const progress = x / rect.width;
                const targetPage = Math.max(1, Math.min(totalPages, Math.round(progress * (totalPages - 1) + 1)));

                    if (pageFlip) pageFlip.turnToPage(hasBlankStart ? targetPage : targetPage - 1);

            try {

            if (window.parent &amp;&amp; window.parent !== window) {

        function initPDF() {

            document.getElementById(&#39;nextBtn&#39;).style.display = &#39;flex&#39;;
            initProgressBar();

            const loadingTask = pdfjsLib.getDocument({
                url: pdfUrl,
                disableAutoFetch: true,
                disableStream: false,
                disableRange: false,
                cMapUrl: CMAP_URL,

                standardFontDataUrl: STANDARD_FONT_DATA_URL,
                withCredentials: false
            });

            loadingTask.onProgress = function (progress) {
                const loader = document.getElementById(&#39;globalLoading&#39;);
                if (!loader) return;
                if (progress.total > 0) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    const textEl = loader.querySelector(&#39;.text&#39;);

            loadingTask.promise.then(async (doc) => {
                pdfDoc = doc;

                const firstPage = await pdfDoc.getPage(1);
                viewport = firstPage.getViewport({ scale: 1 });

                document.getElementById(&#39;pageInfo&#39;).textContent = `1 / ${totalPages}`;
                const dims = calculatePageDimensions();

                flipbook.innerHTML = &#39;&#39;;
                if (hasBlankStart) {
                    const blank = createBlankPageShell(dims);
                    flipbook.appendChild(blank);
                }
                for (let i = 1; i <= totalPages; i++) {
                    const { page, content, canvas } = createFlipPageShell(i, dims);
                    flipbook.appendChild(page);
                    pageShells[i] = { page, content, canvas };
                }

                if (hasBlankStart &amp;&amp; (totalPages % 2 === 0)) {
                    const trailingBlank = createBlankPageShell(dims);
                    flipbook.appendChild(trailingBlank);
                }

                pageFlip = new St.PageFlip(flipbook, {
                    width: Math.max(320, dims.width),
                    height: Math.max(400, dims.height),
                    size: (getEffectiveWidth() <= 768 || document.getElementById(&#39;flipbook-container&#39;).clientWidth <= 768) ? &#39;fixed&#39; : &#39;stretch&#39;,
                    minWidth: 300,
                    maxWidth: 4000,
                    minHeight: 400,
                    maxHeight: 6000,
                    showCover: false,
                    usePortrait: true,
                    autoSize: true,
                    drawShadow: true,
                    flippingTime: 700,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll(&#39;#flipbook .page&#39;));
                if (hasBlankStart) pageFlip.turnToPage(1);

                pageFlip.on(&#39;flip&#39;, (e) => {
                    const idx = (e.data || 0);
                    currentPage = hasBlankStart ? Math.min(totalPages, Math.max(1, idx)) : Math.min(totalPages, idx + 1);
                    updateControls();
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: &#39;pageChange&#39;,
                            currentPage: currentPage,
                            totalPages: totalPages
                        }, &#39;*&#39;);
                    }
                    ensureNearbyPagesRendered(currentPage, RENDER_WINDOW);
                    evictOutsideWindow(currentPage, RENDER_WINDOW + 1);
                    const dims = calculatePageDimensions();
                    const leftPage = currentPage % 2 === 0 ? currentPage : Math.max(1, currentPage - 1);
                    const rightPage = Math.min(totalPages, leftPage + 1);
                    if (renderedPages.has(leftPage)) upgradePageCanvasToHigh(leftPage, dims);
                    if (rightPage !== leftPage &amp;&amp; renderedPages.has(rightPage)) upgradePageCanvasToHigh(rightPage, dims);
                });

                currentPage = 1;
                updateControls();

                const initialCount = Math.min(INITIAL_RENDER_COUNT, totalPages);
                const loaderEl = document.getElementById(&#39;globalLoading&#39;);
                const loaderText = loaderEl ? loaderEl.querySelector(&#39;.text&#39;) : null;

                for (let i = 1; i <= initialCount; i++) {
                    await renderAndDisplayPage(i, i <= 2 ? &#39;high&#39; : &#39;low&#39;);
                    if (loaderText) {
                        const pct = Math.round((i / initialCount) * 100);
                        loaderText.textContent = `Rendering pages: ${pct}%`;
                    }
                }

                if (loaderEl) loaderEl.style.display = &#39;none&#39;;
                document.body.classList.remove(&#39;loading&#39;);

                ensureNearbyPagesRendered(1, RENDER_WINDOW);

                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: &#39;flipbookReady&#39;,
                        totalPages: totalPages
                    }, &#39;*&#39;);
                }
            }).catch(error => {
                console.error(&#39;Error loading PDF:&#39;, error);
                document.getElementById(&#39;globalLoading&#39;).innerHTML = `
                    <div style=&quot;color: white; text-align: center; padding: 20px;&quot;>
                        <h3>Error loading PDF</h3>
                        <p>${error.message || &#39;Please try refreshing the page&#39;}</p>
                    </div>
                `;
            });
        }

        async function renderAndDisplayPage(pageNum, quality) {
            if (renderedPages.has(pageNum)) return;
            const shell = pageShells[pageNum];
            if (!shell) return;
            if (shell.canvas.width === 0 || shell.canvas.height === 0) {
                const dims = calculatePageDimensions();
                const mult = (isFullscreen ? 2.0 : 1.5) * QUALITY_FACTOR;
                shell.canvas.width = clampCanvasSide(Math.floor(dims.width * EFFECTIVE_DPR * mult));
                shell.canvas.height = clampCanvasSide(Math.floor(dims.height * EFFECTIVE_DPR * mult));
            }
            const q = quality || &#39;low&#39;;
            const data = await renderPage(pageNum, q);
            if (!data) return;
            const src = q === &#39;high&#39; ? data.highCanvas : data.lowCanvas;
            if (src) drawInto(shell.canvas, src);
            if (data.links &amp;&amp; data.links.length > 0) {
                addUrlOverlays(shell.content, data.links, data.baseViewport, calculatePageDimensions());
            }
            const ph = shell.content.querySelector(&#39;.page-placeholder&#39;);
            if (ph) ph.remove();
            renderedPages.add(pageNum);
            if (q === &#39;low&#39;) {
                upgradePageCanvasToHigh(pageNum, calculatePageDimensions()).catch(() => {});
            }
        }

        function ensureNearbyPagesRendered(centerPage, range) {
            const r = range || 3;
            const start = Math.max(1, centerPage - r);
            const end = Math.min(totalPages, centerPage + r);
            for (let i = start; i <= end; i++) {
                if (!renderedPages.has(i)) {
                    renderAndDisplayPage(i, i <= centerPage + 1 ? &#39;high&#39; : &#39;low&#39;);
                }
            }
        }

        let resizeTimeout;
        window.addEventListener(&#39;resize&#39;, () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (pageFlip) {
                    pageFlip.update();
                    rebuildAllPagesForQuality();
                }
            }, 150);
        });

        document.addEventListener(&#39;keydown&#39;, (e) => {
            if (!pageFlip) return;
            if (e.key === &#39;ArrowLeft&#39;) {
                if (hasBlankStart &amp;&amp; currentPage <= 1) return;
                pageFlip.flipPrev();
            } else if (e.key === &#39;ArrowRight&#39;) {
                pageFlip.flipNext();
            } else if (e.key === &#39;f&#39; || e.key === &#39;F&#39;) {
                document.getElementById(&#39;fullscreenBtn&#39;).click();
            }
        });

        initPDF();
    </script>

        <script>
            var currentMagPage = 1;
            var currentSlug = '{{ current_slug }}';

            function loadMagazineGrid(page) {
                if (page < 1) return;
                currentMagPage = page;

                var url = '/api/magazines/grid?page=' + page + '&per_page=9';
                if (currentSlug) {
                    url += '&exclude_slug=' + encodeURIComponent(currentSlug);
                }

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var grid = document.getElementById('dynamic-magazine-grid');
                        grid.innerHTML = '';

                        if (!data.magazines || data.magazines.length === 0) {
                            grid.innerHTML = '<p style="text-align:center;padding:2rem;color:#888;">No magazines found.</p>';
                            document.getElementById('magazine-grid-pagination').style.display = 'none';
                            return;
                        }

                        var magazines = data.magazines;
                        for (var i = 0; i < magazines.length; i += 3) {
                            var row = document.createElement('div');
                            row.className = 'magazine-row';

                            for (var j = i; j < Math.min(i + 3, magazines.length); j++) {
                                var mag = magazines[j];
                                var card = document.createElement('div');
                                card.className = 'magazine-card';
                                card.setAttribute('data-slug', mag.slug);
                                card.onclick = (function (slug) {
                                    return function () { window.location.href = '/magazine/' + slug; };
                                })(mag.slug);

                                card.innerHTML =
                                    '<div class="magazine-card-thumb">' +
                                    '<div class="magazine-card-overlay"></div>' +
                                    '<img src="' + mag.image_url + '" alt="' + mag.title + '">' +
                                    '</div>' +
                                    '<div class="magazine-card-title">' + mag.title + '</div>';

                                row.appendChild(card);
                            }
                            grid.appendChild(row);
                        }

                        var paginationEl = document.getElementById('magazine-grid-pagination');
                        if (data.total_pages > 1) {
                            paginationEl.style.display = 'flex';
                            document.getElementById('mag-page-info').textContent = 'Page ' + data.page + ' of ' + data.total_pages;
                            document.getElementById('mag-prev-btn').disabled = !data.has_prev;
                            document.getElementById('mag-next-btn').disabled = !data.has_next;
                            document.getElementById('mag-prev-btn').style.opacity = data.has_prev ? '1' : '0.4';
                            document.getElementById('mag-next-btn').style.opacity = data.has_next ? '1' : '0.4';
                        } else {
                            paginationEl.style.display = 'none';
                        }
                    })
                    .catch(function (err) {
                        console.error('Failed to load magazines grid:', err);
                    });
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadMagazineGrid(1);
            });
        </script>
