<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>{{ issue_title | default("Magazine Flipbook Viewer") }}</title>
        <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #141726;
                overflow: hidden;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }

            #flipbook-container {
                flex: 1;
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                perspective: 2000px;
                overflow: hidden;
                min-height: 400px;
                padding: 10px 10px 70px 10px;
            }

            body.fullscreen-mode {
                background: #000000;
            }

            body.fullscreen-mode #flipbook-container {
                padding: 40px 40px 75px 40px;
            }

            .flipbook {
                position: relative;
                display: block;
                width: 100%;
                height: 100%;
            }

            .page {
                background: #ffffff;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
                cursor: pointer;
            }

            .page .page-content {
                position: relative;
                width: 100%;
                height: 100%;
            }

            .page canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .page[data-blank="true"] {
                background: transparent;
                box-shadow: none;
                cursor: default;
            }

            .nav-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 46px;
                height: 46px;
                background: rgba(255, 255, 255, 0.92);
                color: #0b0e66;
                border-radius: 50%;
                display: none;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 1000;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
                user-select: none;
                font-size: 20px;
            }

            .nav-arrow:hover {
                background: #ffffff;
            }

            .nav-arrow.prev {
                left: 18px;
            }

            .nav-arrow.next {
                right: 18px;
            }

            .nav-arrow.disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }

            @media (max-width: 768px) {
                .nav-arrow {
                    display: none !important;
                }
            }

            #controls {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(10, 12, 24, 0.9);
                backdrop-filter: blur(10px);
                padding: 14px 20px;
                display: flex;
                align-items: center;
                gap: 16px;
                z-index: 1500;
            }

            .progress-container {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .page-info {
                color: #ffffff;
                font-size: 13px;
                font-weight: 600;
                min-width: 72px;
                text-align: center;
            }

            .progress-bar {
                flex: 1;
                height: 4px;
                background: rgba(255, 255, 255, 0.22);
                border-radius: 2px;
                position: relative;
                cursor: pointer;
            }

            .progress-fill {
                height: 100%;
                background: #3b82f6;
                border-radius: 2px;
                position: relative;
                transition: width 0.3s ease;
            }

            .progress-thumb {
                position: absolute;
                top: 50%;
                right: -8px;
                transform: translateY(-50%);
                width: 15px;
                height: 15px;
                background: #ffffff;
                border-radius: 50%;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
                cursor: grab;
            }

            .progress-thumb:active {
                cursor: grabbing;
            }

            .control-btn {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.25);
                color: #ffffff;
                padding: 8px 13px;
                border-radius: 6px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 7px;
                transition: all 0.2s ease;
                font-size: 13px;
                font-weight: 600;
            }

            .control-btn:hover {
                background: rgba(255, 255, 255, 0.16);
                border-color: rgba(255, 255, 255, 0.5);
            }

            @media (max-width: 768px) {
                #controls .control-btn span {
                    display: none !important;
                }

                #controls .control-btn {
                    padding: 8px 10px;
                    gap: 0;
                }
            }

            .url-overlay {
                position: absolute;
                border: 1px solid #3b82f6;
                background: rgba(59, 130, 246, 0.18);
                cursor: pointer;
                transition: all 0.2s ease;
                pointer-events: all;
                border-radius: 4px;
                z-index: 50;
                min-width: 18px;
                min-height: 12px;
            }

            .url-overlay:hover {
                background: rgba(59, 130, 246, 0.45);
                box-shadow: 0 0 14px rgba(59, 130, 246, 0.7);
            }

            .page-loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                z-index: 2000;
            }

            .page-loading .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(255, 255, 255, 0.28);
                border-top: 3px solid #ff6b3d;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .page-loading .text {
                color: rgba(255, 255, 255, 0.85);
                font-size: 14px;
            }

            .page-placeholder {
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #f0f2f8;
                z-index: 5;
            }

            .placeholder-spinner {
                width: 28px;
                height: 28px;
                border: 3px solid #dde2ef;
                border-top: 3px solid #1c4ba0;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            body.loading #controls {
                opacity: 0.5;
                pointer-events: none;
            }

            body.loading .flipbook {
                visibility: hidden;
            }

            body.loading .nav-arrow {
                display: none !important;
            }

            .toast-notification {
                position: fixed;
                bottom: -100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(11, 14, 102, 0.96);
                color: #ffffff;
                padding: 12px 22px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 10px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
                z-index: 3000;
                transition: bottom 0.3s ease;
                font-size: 14px;
                font-weight: 500;
            }

            .toast-notification.show {
                bottom: 72px;
            }

            .download-modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.65);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 5000;
                backdrop-filter: blur(4px);
            }

            .download-modal-overlay.show {
                display: flex;
            }

            .download-modal {
                background: #fbfaf7;
                border-radius: 16px;
                padding: 24px;
                max-width: 520px;
                width: 92%;
                position: relative;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
            }

            .download-modal-close {
                position: absolute;
                top: 10px;
                right: 12px;
                background: none;
                border: none;
                font-size: 24px;
                cursor: pointer;
                color: #5f6368;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
            }

            .download-modal-close:hover {
                background: rgba(0, 0, 0, 0.06);
                color: #111827;
            }

            .download-modal h2 {
                font-size: 21px;
                font-weight: 800;
                color: #0b0e66;
                margin: 0 0 18px 0;
            }

            .download-form-row {
                display: flex;
                gap: 14px;
                margin-bottom: 12px;
            }

            .download-form-field {
                flex: 1;
                position: relative;
            }

            .download-form-field.full-width {
                width: 100%;
            }

            .download-form-field label {
                position: absolute;
                top: 12px;
                left: 14px;
                font-size: 13px;
                color: #5f6368;
                pointer-events: none;
                transition: all 0.2s ease;
            }

            .download-form-field input {
                width: 100%;
                padding: 28px 14px 10px 14px;
                border: 1px solid #e5e2dc;
                border-radius: 8px;
                font-size: 15px;
                background: #f5f3ef;
                color: #1a1a1a;
                outline: none;
                transition: all 0.2s ease;
            }

            .download-form-field input:focus {
                border-color: #1c4ba0;
                background: #ffffff;
            }

            .download-form-field input:focus + label,
            .download-form-field input:not(:placeholder-shown) + label {
                top: 7px;
                font-size: 11px;
                color: #1c4ba0;
            }

            .download-form-field .optional-tag {
                color: #6b7280;
                font-size: 11px;
            }

            .download-form-error {
                color: #dc3545;
                font-size: 12px;
                margin-top: 4px;
                display: none;
            }

            .download-form-field.error input {
                border-color: #dc3545;
            }

            .download-form-field.error .download-form-error {
                display: block;
            }

            .download-form-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-top: 14px;
                font-size: 12px;
                color: #5f6368;
            }

            .download-form-submit {
                background: #0b0e66;
                color: #ffffff;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }

            .download-form-submit:hover {
                background: #1c4ba0;
            }

            .download-form-submit:disabled {
                background: #cbd5e1;
                cursor: not-allowed;
            }

            @media (max-width: 480px) {
                .download-form-row {
                    flex-direction: column;
                    gap: 10px;
                }
            }
        </style>
    </head>
    <body class="loading">
        <div id="flipbook-container">
            <div class="flipbook" id="flipbook"></div>

            <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
                <i class="ph ph-arrow-left"></i>
            </button>
            <button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next page">
                <i class="ph ph-arrow-right"></i>
            </button>

            <div id="globalLoading" class="page-loading">
                <div class="spinner"></div>
                <div class="text">Loading PDF...</div>
            </div>
        </div>

        <div id="controls">
            <div class="progress-container">
                <span class="page-info" id="pageInfo">1 / 1</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                </div>
            </div>

            <button type="button" class="control-btn" id="downloadBtn">
                <i class="ph ph-download"></i>
                <span id="downloadButtonText">Download</span>
            </button>

            <button type="button" class="control-btn" id="fullscreenBtn">
                <i class="ph ph-arrow-square-out" id="fullscreenIcon"></i>
                <span id="fullscreenText">Fullscreen</span>
            </button>
        </div>

        <div id="downloadToast" class="toast-notification">
            <span>Download started! It will continue in the background.</span>
        </div>

        <div id="downloadModalOverlay" class="download-modal-overlay">
            <div class="download-modal">
                <button type="button" class="download-modal-close" id="downloadModalClose">&times;</button>
                <h2>Download PDF copy</h2>
                <form id="downloadForm">
                    <div class="download-form-row">
                        <div class="download-form-field">
                            <input type="text" id="firstName" name="firstName" placeholder=" " required />
                            <label for="firstName">First name</label>
                            <div class="download-form-error">Please enter your first name</div>
                        </div>
                        <div class="download-form-field">
                            <input type="text" id="lastName" name="lastName" placeholder=" " />
                            <label for="lastName">Last name <span class="optional-tag">(optional)</span></label>
                        </div>
                    </div>
                    <div class="download-form-row">
                        <div class="download-form-field full-width">
                            <input type="email" id="workEmail" name="workEmail" placeholder=" " required />
                            <label for="workEmail">Email address</label>
                            <div class="download-form-error">Please enter a valid email address</div>
                        </div>
                    </div>
                    <div class="download-form-row">
                        <div class="download-form-field">
                            <input type="text" id="companyName" name="companyName" placeholder=" " />
                            <label for="companyName">Company <span class="optional-tag">(optional)</span></label>
                        </div>
                        <div class="download-form-field">
                            <input type="text" id="mobileNumber" name="mobileNumber" placeholder=" " />
                            <label for="mobileNumber">Mobile <span class="optional-tag">(optional)</span></label>
                        </div>
                    </div>
                    <div class="download-form-footer">
                        <span>Instant PDF download via Brands Out Loud</span>
                        <button type="submit" class="download-form-submit" id="downloadFormSubmit">Download PDF</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            const PROXY_PDF_URL = {{ proxy_pdf_url | tojson }};
            const RAW_PDF_URL = {{ raw_pdf_url | tojson }};
            const PDFJS_VERSION = "3.11.174";
            const CMAP_URL = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/cmaps/`;
            const STANDARD_FONT_DATA_URL = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/standard_fonts/`;
            pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;

            function getEffectiveWidth() {
                try {
                    if (window.parent && window.parent !== window) return window.parent.innerWidth;
                } catch (e) {}
                return window.innerWidth || document.documentElement.clientWidth || 0;
            }

            function isMobileOrTablet() {
                const w = getEffectiveWidth();
                const touch = Boolean(navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
                return w <= 768 || touch;
            }

            function getEffectiveDpr() {
                const raw = window.devicePixelRatio || 1;
                return isMobileOrTablet() ? Math.min(raw, 1.25) : Math.min(raw, 2.0);
            }

            function getRenderMultiplier() {
                if (isMobileOrTablet()) return 1.0;
                return isFullscreen ? 1.5 : 1.2;
            }

            function getWindowRadius() {
                return isMobileOrTablet() ? 2 : 3;
            }

            let pdfDoc = null;
            let totalPages = 0;
            let currentPage = 1;
            let viewport = null;
            let isFullscreen = false;
            let isDragging = false;
            let pageFlip = null;
            const hasBlankStart = !(getEffectiveWidth() <= 768);
            const renderedPages = new Set();
            const pageShells = {};
            const pageAnnotations = {};
            const renderTasks = {};
            let isUpdatingWindow = false;
            let pendingWindowCenter = null;

            function calculatePageDimensions() {
                const container = document.getElementById("flipbook-container");
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                if (!viewport) return { width: 300, height: 400 };

                const pageAspectRatio = viewport.width / viewport.height;
                const padding = isFullscreen ? 40 : 20;
                const controlsHeight = 65;
                const availableWidth = containerWidth - padding * 2;
                const availableHeight = containerHeight - controlsHeight - padding * 2;
                const singlePageMode = getEffectiveWidth() <= 768 || containerWidth <= 768;

                let pageWidth = (availableWidth * 0.98) / (singlePageMode ? 1 : 2);
                let pageHeight = pageWidth / pageAspectRatio;
                if (pageHeight > availableHeight * 0.95) {
                    pageHeight = availableHeight * 0.95;
                    pageWidth = pageHeight * pageAspectRatio;
                }

                return {
                    width: Math.max(240, Math.floor(pageWidth)),
                    height: Math.max(320, Math.floor(pageHeight))
                };
            }

            function addUrlOverlays(pageContent, links, baseViewport) {
                const bw = baseViewport.width || 1;
                const bh = baseViewport.height || 1;
                links.forEach((link) => {
                    const [left, top, width, height] = link.rect;
                    const overlay = document.createElement("div");
                    overlay.className = "url-overlay";
                    overlay.style.left = `${(left / bw) * 100}%`;
                    overlay.style.top = `${(top / bh) * 100}%`;
                    overlay.style.width = `${Math.max(0, (width / bw) * 100)}%`;
                    overlay.style.height = `${Math.max(0, (height / bh) * 100)}%`;
                    overlay.title = link.url;
                    overlay.addEventListener("click", (e) => {
                        e.stopPropagation();
                        window.open(link.url, "_blank", "noopener");
                    });
                    pageContent.appendChild(overlay);
                });
            }

            function createFlipPageShell(pageNum, dimensions) {
                const page = document.createElement("div");
                page.className = "page";
                page.dataset.page = pageNum;
                page.style.width = `${dimensions.width}px`;
                page.style.height = `${dimensions.height}px`;

                const content = document.createElement("div");
                content.className = "page-content";

                const canvas = document.createElement("canvas");
                canvas.width = 1;
                canvas.height = 1;

                const placeholder = document.createElement("div");
                placeholder.className = "page-placeholder";
                const spinner = document.createElement("div");
                spinner.className = "placeholder-spinner";
                placeholder.appendChild(spinner);

                content.appendChild(canvas);
                content.appendChild(placeholder);
                page.appendChild(content);
                return { page, content, canvas, placeholder };
            }

            function createBlankPageShell(dimensions) {
                const page = document.createElement("div");
                page.className = "page";
                page.dataset.blank = "true";
                page.style.width = `${dimensions.width}px`;
                page.style.height = `${dimensions.height}px`;
                const content = document.createElement("div");
                content.className = "page-content";
                page.appendChild(content);
                return page;
            }

            async function renderPageDirect(pageNum) {
                if (!pdfDoc) return;
                const shell = pageShells[pageNum];
                if (!shell) return;
                if (renderedPages.has(pageNum)) return;

                if (renderTasks[pageNum]) {
                    try {
                        renderTasks[pageNum].cancel();
                    } catch (e) {}
                    delete renderTasks[pageNum];
                }

                try {
                    const page = await pdfDoc.getPage(pageNum);
                    let cachedData = pageAnnotations[pageNum];
                    if (!cachedData) {
                        const baseViewport = page.getViewport({ scale: 1 });
                        const annotations = await page.getAnnotations();
                        const links = annotations
                            .filter((ann) => ann.subtype === "Link" && ann.url && ann.rect)
                            .map((ann) => {
                                try {
                                    const [x1, y1, x2, y2] = baseViewport.convertToViewportRectangle(ann.rect);
                                    return {
                                        url: ann.url,
                                        rect: [Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)]
                                    };
                                } catch (e) {
                                    return null;
                                }
                            })
                            .filter(Boolean);
                        cachedData = { baseViewport, links };
                        pageAnnotations[pageNum] = cachedData;
                    }

                    const dims = calculatePageDimensions();
                    const dpr = getEffectiveDpr();
                    const mult = getRenderMultiplier();
                    const targetW = Math.max(1, Math.floor(dims.width * dpr * mult));
                    const targetH = Math.max(1, Math.floor(dims.height * dpr * mult));

                    shell.canvas.width = targetW;
                    shell.canvas.height = targetH;

                    const renderViewport = page.getViewport({ scale: targetW / cachedData.baseViewport.width });
                    const ctx = shell.canvas.getContext("2d", { alpha: false });
                    const task = page.render({ canvasContext: ctx, viewport: renderViewport });
                    renderTasks[pageNum] = task;

                    await task.promise;
                    delete renderTasks[pageNum];
                    renderedPages.add(pageNum);

                    if (shell.placeholder) {
                        shell.placeholder.style.display = "none";
                    }

                    shell.content.querySelectorAll(".url-overlay").forEach((el) => el.remove());
                    if (cachedData.links && cachedData.links.length > 0) {
                        addUrlOverlays(shell.content, cachedData.links, cachedData.baseViewport);
                    }

                    try {
                        page.cleanup();
                    } catch (e) {}
                } catch (error) {
                    delete renderTasks[pageNum];
                    if (error && error.name === "RenderingCancelledException") {
                        return;
                    }
                    console.error(`Error rendering page ${pageNum}:`, error);
                }
            }

            function evictPage(pageNum) {
                if (renderTasks[pageNum]) {
                    try {
                        renderTasks[pageNum].cancel();
                    } catch (e) {}
                    delete renderTasks[pageNum];
                }

                const shell = pageShells[pageNum];
                if (!shell) return;

                shell.canvas.width = 1;
                shell.canvas.height = 1;

                shell.content.querySelectorAll(".url-overlay").forEach((el) => el.remove());

                if (shell.placeholder) {
                    shell.placeholder.style.display = "flex";
                }

                renderedPages.delete(pageNum);
            }

            async function updateActiveWindow(centerPage) {
                if (!pdfDoc || totalPages === 0) return;
                if (isUpdatingWindow) {
                    pendingWindowCenter = centerPage;
                    return;
                }
                isUpdatingWindow = true;

                const radius = getWindowRadius();
                const minPage = Math.max(1, centerPage - radius);
                const maxPage = Math.min(totalPages, centerPage + radius);
                const targetSet = new Set();
                for (let i = minPage; i <= maxPage; i++) {
                    targetSet.add(i);
                }

                for (const p of Array.from(renderedPages)) {
                    if (!targetSet.has(p)) {
                        evictPage(p);
                    }
                }

                for (const pStr of Object.keys(renderTasks)) {
                    const p = parseInt(pStr, 10);
                    if (!targetSet.has(p)) {
                        evictPage(p);
                    }
                }

                const needed = Array.from(targetSet)
                    .filter((p) => !renderedPages.has(p))
                    .sort((a, b) => Math.abs(a - centerPage) - Math.abs(b - centerPage));

                for (const p of needed) {
                    if (pendingWindowCenter !== null && pendingWindowCenter !== centerPage) {
                        break;
                    }
                    await renderPageDirect(p);
                }

                isUpdatingWindow = false;
                if (pendingWindowCenter !== null) {
                    const nextCenter = pendingWindowCenter;
                    pendingWindowCenter = null;
                    updateActiveWindow(nextCenter);
                }
            }

            function rebuildActivePagesForQuality() {
                const dims = calculatePageDimensions();
                for (let i = 1; i <= totalPages; i++) {
                    const shell = pageShells[i];
                    if (shell) {
                        shell.page.style.width = `${dims.width}px`;
                        shell.page.style.height = `${dims.height}px`;
                    }
                }
                const active = Array.from(renderedPages);
                for (const p of active) {
                    evictPage(p);
                }
                updateActiveWindow(currentPage);
            }

            function updateControls() {
                document.getElementById("pageInfo").textContent = `${currentPage} / ${totalPages}`;
                const progress = totalPages > 1 ? ((currentPage - 1) / (totalPages - 1)) * 100 : 0;
                document.getElementById("progressFill").style.width = `${progress}%`;
                document.getElementById("prevBtn").classList.toggle("disabled", currentPage <= 1);
                document.getElementById("nextBtn").classList.toggle("disabled", currentPage >= totalPages);
            }

            function initProgressBar() {
                const progressBar = document.getElementById("progressBar");
                const progressThumb = document.getElementById("progressThumb");

                function updateProgressFromMouse(e) {
                    const rect = progressBar.getBoundingClientRect();
                    const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                    const progress = x / (rect.width || 1);
                    const targetPage = Math.max(1, Math.min(totalPages, Math.round(progress * (totalPages - 1) + 1)));
                    if (targetPage !== currentPage && pageFlip) {
                        currentPage = targetPage;
                        updateControls();
                        pageFlip.turnToPage(hasBlankStart ? targetPage : targetPage - 1);
                        updateActiveWindow(targetPage);
                    }
                }

                progressThumb.addEventListener("mousedown", (e) => {
                    isDragging = true;
                    e.preventDefault();
                });
                document.addEventListener("mousemove", (e) => {
                    if (isDragging) updateProgressFromMouse(e);
                });
                document.addEventListener("mouseup", () => {
                    isDragging = false;
                });
                progressBar.addEventListener("click", (e) => {
                    if (!isDragging) updateProgressFromMouse(e);
                });
            }

            document.getElementById("prevBtn").addEventListener("click", () => {
                if (pageFlip && currentPage > 1) pageFlip.flipPrev();
            });

            document.getElementById("nextBtn").addEventListener("click", () => {
                if (pageFlip && currentPage < totalPages) pageFlip.flipNext();
            });

            function showDownloadToast() {
                const toast = document.getElementById("downloadToast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 3000);
            }

            function showDownloadModal() {
                document.getElementById("downloadModalOverlay").classList.add("show");
            }

            function hideDownloadModal() {
                document.getElementById("downloadModalOverlay").classList.remove("show");
                document.getElementById("downloadForm").reset();
                document.querySelectorAll(".download-form-field").forEach((f) => f.classList.remove("error"));
            }

            function performDownload() {
                const filename = decodeURIComponent(RAW_PDF_URL.split("/").pop() || "magazine.pdf");
                showDownloadToast();
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action: "download", pdfUrl: RAW_PDF_URL, filename }, window.location.origin);
                    return;
                }
                const a = document.createElement("a");
                a.href = `/download_proxy?pdf=${encodeURIComponent(RAW_PDF_URL)}&filename=${encodeURIComponent(filename)}`;
                a.download = filename;
                a.style.display = "none";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            async function submitDownloadForm(firstName, lastName, email, companyName, mobileNumber) {
                try {
                    const response = await fetch("/api/pdf-download-form", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            first_name: firstName,
                            last_name: lastName,
                            email: email,
                            company_name: companyName,
                            mobile_number: mobileNumber,
                            pdf_link: RAW_PDF_URL
                        })
                    });
                    return response.ok;
                } catch (err) {
                    return false;
                }
            }

            document.getElementById("downloadBtn").addEventListener("click", () => {
                try {
                    if (localStorage.getItem("bol_token")) {
                        performDownload();
                        return;
                    }
                } catch (e) {}
                showDownloadModal();
            });

            document.getElementById("downloadModalClose").addEventListener("click", hideDownloadModal);
            document.getElementById("downloadModalOverlay").addEventListener("click", (e) => {
                if (e.target === e.currentTarget) hideDownloadModal();
            });

            document.getElementById("downloadForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const firstName = document.getElementById("firstName").value.trim();
                const lastName = document.getElementById("lastName").value.trim();
                const email = document.getElementById("workEmail").value.trim();
                const companyName = document.getElementById("companyName").value.trim();
                const mobileNumber = document.getElementById("mobileNumber").value.trim();

                let hasError = false;
                document.querySelectorAll(".download-form-field").forEach((f) => f.classList.remove("error"));

                if (!firstName) {
                    document.getElementById("firstName").closest(".download-form-field").classList.add("error");
                    hasError = true;
                }
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById("workEmail").closest(".download-form-field").classList.add("error");
                    hasError = true;
                }
                if (hasError) return;

                const submitBtn = document.getElementById("downloadFormSubmit");
                submitBtn.disabled = true;
                submitBtn.textContent = "Processing...";
                await submitDownloadForm(firstName, lastName, email, companyName, mobileNumber);
                hideDownloadModal();
                performDownload();
                submitBtn.disabled = false;
                submitBtn.textContent = "Download PDF";
            });

            document.getElementById("fullscreenBtn").addEventListener("click", () => {
                if (!isFullscreen) {
                    const target = document.documentElement;
                    if (target.requestFullscreen) target.requestFullscreen();
                    else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            });

            function handleFullscreenChange() {
                isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
                document.body.classList.toggle("fullscreen-mode", isFullscreen);
                document.getElementById("fullscreenText").textContent = isFullscreen ? "Exit Fullscreen" : "Fullscreen";
                if (pageFlip) {
                    setTimeout(() => {
                        pageFlip.update();
                        setTimeout(rebuildActivePagesForQuality, 100);
                    }, 50);
                }
            }

            document.addEventListener("fullscreenchange", handleFullscreenChange);
            document.addEventListener("webkitfullscreenchange", handleFullscreenChange);

            window.addEventListener("message", (event) => {
                if (event.origin !== window.location.origin) return;
                const msg = event.data || {};
                const msgType = msg.type || msg.action;
                if (msgType === "flipToPage" && pageFlip) {
                    const tp = Math.max(1, Math.min(totalPages, msg.page || 1));
                    currentPage = tp;
                    updateControls();
                    pageFlip.turnToPage(hasBlankStart ? tp : tp - 1);
                    updateActiveWindow(tp);
                } else if (msgType === "nextPage" && pageFlip && currentPage < totalPages) {
                    pageFlip.flipNext();
                } else if (msgType === "prevPage" && pageFlip && currentPage > 1) {
                    pageFlip.flipPrev();
                } else if (msgType === "toggleFullscreen") {
                    document.getElementById("fullscreenBtn").click();
                }
            });

            function initPDF() {
                const flipbook = document.getElementById("flipbook");
                document.getElementById("prevBtn").style.display = "flex";
                document.getElementById("nextBtn").style.display = "flex";
                initProgressBar();

                const loadingTask = pdfjsLib.getDocument({
                    url: PROXY_PDF_URL,
                    disableAutoFetch: true,
                    disableStream: false,
                    disableRange: false,
                    cMapUrl: CMAP_URL,
                    cMapPacked: true,
                    standardFontDataUrl: STANDARD_FONT_DATA_URL
                });

                loadingTask.onProgress = function (progress) {
                    const textEl = document.querySelector("#globalLoading .text");
                    if (textEl && progress.total > 0) {
                        textEl.textContent = `Loading PDF: ${Math.round((progress.loaded / progress.total) * 100)}%`;
                    }
                };

                loadingTask.promise
                    .then(async (doc) => {
                        pdfDoc = doc;
                        totalPages = pdfDoc.numPages;
                        const firstPage = await pdfDoc.getPage(1);
                        viewport = firstPage.getViewport({ scale: 1 });
                        document.getElementById("pageInfo").textContent = `1 / ${totalPages}`;
                        const dims = calculatePageDimensions();

                        flipbook.innerHTML = "";
                        if (hasBlankStart) {
                            flipbook.appendChild(createBlankPageShell(dims));
                        }
                        for (let i = 1; i <= totalPages; i++) {
                            const shell = createFlipPageShell(i, dims);
                            flipbook.appendChild(shell.page);
                            pageShells[i] = shell;
                        }
                        if (hasBlankStart && totalPages % 2 === 0) {
                            flipbook.appendChild(createBlankPageShell(dims));
                        }

                        pageFlip = new St.PageFlip(flipbook, {
                            width: Math.max(300, dims.width),
                            height: Math.max(400, dims.height),
                            size: getEffectiveWidth() <= 768 ? "fixed" : "stretch",
                            minWidth: 260,
                            maxWidth: 4000,
                            minHeight: 360,
                            maxHeight: 6000,
                            showCover: false,
                            usePortrait: true,
                            autoSize: true,
                            drawShadow: true,
                            flippingTime: 700,
                            maxShadowOpacity: 0.5,
                            mobileScrollSupport: true
                        });

                        pageFlip.loadFromHTML(document.querySelectorAll("#flipbook .page"));
                        if (hasBlankStart) pageFlip.turnToPage(1);

                        pageFlip.on("flip", (e) => {
                            const idx = e.data || 0;
                            currentPage = hasBlankStart ? Math.min(totalPages, Math.max(1, idx)) : Math.min(totalPages, idx + 1);
                            updateControls();
                            updateActiveWindow(currentPage);
                        });

                        currentPage = 1;
                        updateControls();

                        const loaderEl = document.getElementById("globalLoading");
                        const loaderText = loaderEl ? loaderEl.querySelector(".text") : null;
                        if (loaderText) {
                            loaderText.textContent = "Rendering initial page...";
                        }

                        await renderPageDirect(1);
                        if (!isMobileOrTablet() && totalPages >= 2) {
                            await renderPageDirect(2);
                        }

                        if (loaderEl) loaderEl.style.display = "none";
                        document.body.classList.remove("loading");

                        updateActiveWindow(1);
                    })
                    .catch((error) => {
                        console.error("Error loading PDF:", error);
                        document.getElementById("globalLoading").innerHTML =
                            `<div style="color: white; text-align: center; padding: 20px;"><h3>Error loading PDF</h3><p>${error.message || "Please try refreshing the page"}</p></div>`;
                    });
            }

            let resizeTimeout;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (pageFlip) {
                        pageFlip.update();
                        rebuildActivePagesForQuality();
                    }
                }, 150);
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hideDownloadModal();
                if (!pageFlip) return;
                if (e.key === "ArrowLeft") {
                    if (hasBlankStart && currentPage <= 1) return;
                    pageFlip.flipPrev();
                } else if (e.key === "ArrowRight") {
                    pageFlip.flipNext();
                } else if (e.key === "f" || e.key === "F") {
                    document.getElementById("fullscreenBtn").click();
                }
            });

            initPDF();
        </script>
    </body>
</html>
