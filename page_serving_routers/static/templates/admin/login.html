<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Brands of Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --accent: #3B4FD4;
            --accent-dark: #0D1030;
            --accent-gradient: linear-gradient(135deg, #0D1030, #3B4FD4);
            --border: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: #f5f5f5;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        h1,
        h2,
        h3 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header h2 {
            font-size: 2rem;
            letter-spacing: -1px;
            color: var(--text);
        }

        .login-container {
            background: var(--bg);
            padding: 3rem 2.5rem;
            border: 2px solid var(--border);
            box-shadow: 12px 12px 0 var(--border);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent-gradient);
        }

        .login-header {
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-size: 2.25rem;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-family: 'Space Mono', monospace;
            color: #555;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: var(--bg);
            color: var(--text);
        }

        .form-group input:focus {
            background: var(--text);
            color: white;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input:focus::placeholder {
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            margin-top: 0.5rem;
            background: var(--text);
            color: white;
            border: 2px solid var(--border);
            font-family: 'Oswald', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent-gradient);
            border-color: var(--accent);
        }

        .error-message {
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            padding: 0.875rem 1rem;
            background: #fff;
            border: 2px solid var(--accent);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                box-shadow: 6px 6px 0 var(--border);
            }

            .login-header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>Admin Gateway</h1>
                <p>Sign in to your dashboard</p>
            </div>

            <div class="error-message" id="errorMsg"></div>

            <form action="/admin/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Enter admin username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Secure Login</button>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            const errorElement = document.getElementById('errorMsg');
            errorElement.textContent = params.get('error');
            errorElement.style.display = 'block';
        }
    </script>
</body>

</html>
